[project]
name = "flutter-wars-server"
version = "0.0.1"
description = "GDG Flutter Workshop backend — Module M infrastructure (deployment, database operations, migrations)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "sqlmodel",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn",
    "pytest",
    "httpx",
    # Migration tooling. Dev-only: runs locally/CI against Neon, never bundled
    # into the Worker (kept out of [project].dependencies on purpose).
    "alembic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
